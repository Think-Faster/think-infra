# ============================================================
# Пользователи сервисов и их права в vhost tf.
# Применяются tf-rabbit-init при каждом `docker compose up`.
#
# Формат (поля через пробелы):
#   <пользователь>  <переменная с паролем>  <configure>  <write>  <read>
#
# configure/write/read - регулярные выражения по именам exchange и очередей:
#   configure - создавать/удалять/привязывать;
#   write     - публиковать в exchange;
#   read      - читать из очереди.
# ^$ - ничего.
#
# Пароль берётся из переменной окружения (.env) и перезаписывается при каждом запуске init.
# Удаление строки НЕ удаляет пользователя - см. README.
# Администратор admin создаётся самим RabbitMQ, здесь его нет.
# ============================================================

# публикует команды модели и уведомления
tf-bff              TF_RABBIT_BFF_PASSWORD       ^$  ^(tf\.model\.commands|tf\.notifications)$  ^$

# читает команды модели
tf-model            TF_RABBIT_MODEL_PASSWORD     ^$  ^$  ^tf\.model\.commands$

# контейнер почты: читает только свою очередь
tf-notify-email     TF_RABBIT_EMAIL_PASSWORD     ^$  ^$  ^tf\.notify\.email$

# Telegram-бот: читает только свою очередь
tf-notify-telegram  TF_RABBIT_TELEGRAM_PASSWORD  ^$  ^$  ^tf\.notify\.telegram$
