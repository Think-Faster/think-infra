# Настройки tf-rabbit поверх стандартных настроек образа.

# Аларм по памяти: 60% от лимита контейнера (mem_limit в docker-compose.yml).
# При аларме брокер перестаёт принимать публикации, healthcheck становится unhealthy.
vm_memory_high_watermark.relative = 0.6

# Аларм по диску: свободного места на томе меньше 1 ГБ.
disk_free_limit.absolute = 1GB

# guest может входить только с localhost (на случай, если его кто-то создаст вручную).
loopback_users.guest = true
