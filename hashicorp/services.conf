# ============================================================
# Сервисы приложения, которые при старте контейнера читают секреты из Vault.
# По этому файлу hashicorp/scripts/setup.sh apply создаёт для каждого сервиса
# политику tf-svc-<сервис> (только чтение перечисленных путей) и AppRole tf-svc-<сервис>.
# Доступ для GitHub: hashicorp/scripts/setup.sh service-credentials <сервис>
#
# Формат: <сервис>  <пути в secret/tf/ через пробел>
#   app/<сервис> — собственные секреты сервиса (JWT, SMTP, токены API), строки в secrets.conf
#
# Права выдаются на путь целиком — указывать пути только своих учёток (kafka/bff, а не kafka).
# Удалить строку — политика и роль остаются в Vault, удалить вручную.
# ============================================================

tf-bff      postgres/bff  kafka/bff  rabbit/bff  redis  app/tf-bff
tf-auth     postgres/auth redis  app/tf-auth
tf-funnel   kafka/funnel  redis  app/tf-funnel
tf-model    kafka/model   rabbit/model  redis  app/tf-model
tf-notify   rabbit/email  rabbit/telegram  redis  app/tf-notify
tf-audit    postgres/audit  redis  app/tf-audit
