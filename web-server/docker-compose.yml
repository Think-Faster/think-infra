services:

  nginx:
    image: nginx:1.29-alpine
    container_name: tf-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro

    networks:
      - gateway


networks:
  gateway:
    name: ${DOCKER_NETWORK}
    external: true
