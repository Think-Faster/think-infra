services:
  postgres:
    image: postgres:16
    container_name: tf-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tf
      POSTGRES_USER: tf
      # Из Vault (secret/tf/postgres), подставляет scripts/deploy.sh.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}

    # Порт на хосте — для администрирования (pgAdmin через SSH-туннель).
    # Адрес и порт задаются в stands/<стенд>.env: DB_BIND=127.0.0.1 — только с самого сервера,
    # снаружи база недоступна. Сервисы подключаются не сюда, а к tf-postgres:5432 в think-fast-net.
    ports:
      - "${DB_BIND:-127.0.0.1}:${DB_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_backups:/backups

    networks:
      - app-network
      # Сервисы (tf-auth, tf-bff, ...) ходят в базу по имени tf-postgres:5432.
      - think-fast-net

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tf -d tf"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_backups:

networks:
  app-network:
    driver: bridge
  think-fast-net:
    external: true
