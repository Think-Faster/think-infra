services:
  create-schema:
    build:
      context: ./db
      dockerfile: Dockerfile.create_schema

    container_name: tf-create-schema

    # Пароли схем (TF_PG_<СХЕМА>_ADMIN/USER_PASSWORD) передаёт scripts/deploy.sh
    # через `docker compose run -e`. Все пароли — из Vault.
    environment:
      POSTGRES_HOST: tf-postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: tf
      POSTGRES_ADMIN_USER: tf
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}

    networks:
      - app-network
      
    volumes:
      - ./db/schemas.conf:/app/schemas.conf:ro

    stdin_open: true
    tty: true

    restart: "no"

networks:
  app-network:
    driver: bridge
