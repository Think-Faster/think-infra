name: deploy samba

on:
  push:
    branches: [dev, prod]
    paths:
      - samba/**
      - scripts/**
      - secrets.conf
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-samba.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: samba
    secrets: inherit
