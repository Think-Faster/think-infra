name: deploy postgree

on:
  push:
    branches: [dev, prod]
    paths:
      - postgree/**
      - scripts/**
      - secrets.conf
      - stands/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-postgree.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: postgree
    secrets: inherit
