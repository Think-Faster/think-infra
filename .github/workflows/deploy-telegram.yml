name: deploy telegram

on:
  push:
    branches: [dev, prod]
    paths:
      - telegram/**
      - scripts/**
      - secrets.conf
      - stands/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-telegram.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: telegram
    secrets: inherit
