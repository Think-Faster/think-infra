name: deploy redis

on:
  push:
    branches: [dev, prod]
    paths:
      - redis/**
      - scripts/**
      - secrets.conf
      - stands/**
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-redis.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: redis
    secrets: inherit
