name: deploy web-server

on:
  push:
    branches: [dev, prod]
    paths:
      - web-server/**
      - scripts/**
      - secrets.conf
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-web-server.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: web-server
    secrets: inherit
