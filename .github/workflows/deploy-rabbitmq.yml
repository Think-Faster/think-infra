name: deploy rabbitmq

on:
  push:
    branches: [dev, prod]
    paths:
      - rabbitmq/**
      - scripts/**
      - secrets.conf
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-rabbitmq.yml
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      service: rabbitmq
    secrets: inherit
