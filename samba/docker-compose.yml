services:
  samba-ad:
    build:
      context: .
      dockerfile: Dockerfile

    privileged: true
    container_name: samba-ad
    hostname: dc.tf.greefob.ru

    restart: unless-stopped

    # SAMBA_DOMAIN, SAMBA_REALM, SAMBA_NETBIOS — несекретные настройки из локального .env.
    # SAMBA_ADMIN_PASSWORD — из Vault (secret/tf/samba), подставляет scripts/deploy.sh.
    # Все значения применяются только при первом создании домена (пустой ./data).
    environment:
      DOMAIN: ${SAMBA_DOMAIN:?SAMBA_DOMAIN is not set}
      REALM: ${SAMBA_REALM:?SAMBA_REALM is not set}
      NETBIOS: ${SAMBA_NETBIOS:?SAMBA_NETBIOS is not set}
      ADMIN_PASSWORD: ${SAMBA_ADMIN_PASSWORD:?SAMBA_ADMIN_PASSWORD is not set}

    volumes:
      - ./data/samba:/var/lib/samba
      - ./data/etc-samba:/etc/samba

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "88:88/tcp"
      - "88:88/udp"
      - "389:389/tcp"
      - "389:389/udp"
      - "445:445/tcp"
      - "464:464/tcp"
      - "464:464/udp"
      - "636:636/tcp"
      - "3268:3268/tcp"
      - "3269:3269/tcp"
