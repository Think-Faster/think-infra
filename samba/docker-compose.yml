services:
  samba-ad:
    build:
      context: .
      dockerfile: Dockerfile

    privileged: true
    container_name: samba-ad
    hostname: dc.tf.greefob.ru

    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}
      REALM: ${REALM}
      NETBIOS: ${NETBIOS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is not set}

    volumes:
      - ./data/samba:/var/lib/samba
      - ./data/etc-samba:/etc/samba

    # Наружу — ничего. tf-auth ходит в каталог по имени samba-ad внутри think-fast-net
    # (LDAPS 636). Порты на хосте — только localhost, для администрирования по SSH-туннелю.
    # SAMBA_BIND=<адрес> открывает их на другом адресе — только осознанно: LDAP 389 и SMB 445 без TLS.
    ports:
      - "${SAMBA_BIND:-127.0.0.1}:53:53/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:53:53/udp"
      - "${SAMBA_BIND:-127.0.0.1}:88:88/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:88:88/udp"
      - "${SAMBA_BIND:-127.0.0.1}:389:389/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:389:389/udp"
      - "${SAMBA_BIND:-127.0.0.1}:445:445/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:464:464/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:464:464/udp"
      - "${SAMBA_BIND:-127.0.0.1}:636:636/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:3268:3268/tcp"
      - "${SAMBA_BIND:-127.0.0.1}:3269:3269/tcp"

    networks:
      - think-fast-net

networks:
  think-fast-net:
    external: true
