services:
  samba-ad:
    image: dockurr/samba
    container_name: samba-ad
    hostname: dc
    restart: unless-stopped

    environment:
      DOMAIN: ${SAMBA_DOMAIN}
      REALM: ${SAMBA_REALM}
      NETBIOS: ${SAMBA_NETBIOS}
      ADMIN_PASSWORD: ${SAMBA_ADMIN_PASSWORD}

    volumes:
      - samba_data:/var/lib/samba
      - samba_etc:/etc/samba

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "88:88/tcp"
      - "88:88/udp"
      - "135:135/tcp"
      - "137-138:137-138/udp"
      - "139:139/tcp"
      - "389:389/tcp"
      - "389:389/udp"
      - "445:445/tcp"
      - "464:464/tcp"
      - "464:464/udp"
      - "636:636/tcp"
      - "3268:3268/tcp"
      - "3269:3269/tcp"

    cap_add:
      - NET_ADMIN