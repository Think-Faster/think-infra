services:
  samba-ad:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: samba-ad
    hostname: dc.tf.greefob.ru

    restart: unless-stopped

    environment:
      DOMAIN: ${DOMAIN}
      REALM: ${REALM}
      NETBIOS: ${NETBIOS}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

    volumes:
      - ./data/samba:/var/lib/samba
      - ./data/etc-samba:/etc/samba

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "88:88/tcp"
      - "88:88/udp"
      - "389:389/tcp"
      - "389:389/udp"
      - "445:445/tcp"
      - "464:464/tcp"
      - "464:464/udp"
      - "636:636/tcp"
      - "3268:3268/tcp"
      - "3269:3269/tcp"