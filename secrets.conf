# ============================================================
# Все секреты инфраструктуры. Единственный источник списка.
# Значения лежат в Vault своего стенда (dev, prod): secret/tf/<путь>, ключ = имя переменной окружения.
# Несекретные настройки стендов — stands/<стенд>.env.
#
# Формат (поля через пробелы):
#   <папка сервиса>  <путь в secret/tf/>  <ключ>  <генератор>
#
# Генераторы (scripts/secrets.sh):
#   hex         openssl rand -hex 24: 48 символов [0-9a-f]
#   cluster-id  идентификатор кластера KRaft (16 случайных байт в base64url). НЕ ротируется.
#
# Добавить секрет: строка здесь → scripts/secrets.sh init → использовать переменную в compose.
# Новая схема в postgree/db/schemas.conf → две строки TF_PG_<СХЕМА>_ADMIN/USER_PASSWORD.
# ============================================================

# PostgreSQL: суперпользователь tf
postgree   postgres       POSTGRES_PASSWORD           hex

# PostgreSQL: пользователи схем (postgree/db/schemas.conf)
postgree   postgres/auth  TF_PG_AUTH_ADMIN_PASSWORD   hex
postgree   postgres/auth  TF_PG_AUTH_USER_PASSWORD    hex
postgree   postgres/bff   TF_PG_BFF_ADMIN_PASSWORD    hex
postgree   postgres/bff   TF_PG_BFF_USER_PASSWORD     hex

# Kafka
kafka      kafka          KAFKA_CLUSTER_ID            cluster-id
kafka      kafka          TF_KAFKA_ADMIN_PASSWORD     hex
kafka      kafka          TF_KAFKA_FUNNEL_PASSWORD    hex
kafka      kafka          TF_KAFKA_MODEL_PASSWORD     hex
kafka      kafka          TF_KAFKA_BFF_PASSWORD       hex

# RabbitMQ
rabbitmq   rabbit         TF_RABBIT_ADMIN_PASSWORD    hex
rabbitmq   rabbit         TF_RABBIT_BFF_PASSWORD      hex
rabbitmq   rabbit         TF_RABBIT_MODEL_PASSWORD    hex
rabbitmq   rabbit         TF_RABBIT_EMAIL_PASSWORD    hex
rabbitmq   rabbit         TF_RABBIT_TELEGRAM_PASSWORD hex

# Redis
redis      redis          TF_REDIS_PASSWORD           hex
