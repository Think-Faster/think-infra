# ============================================================
# Права доступа сервисов (ACL). Применяются tf-kafka-init вместе с топиками.
# Всё, что здесь не разрешено, запрещено.
#
# Формат (поля через пробелы):
#   <пользователь>  <topic|group>  <literal|prefixed>  <имя>  <операции через запятую>
#
# literal  - ровно это имя; prefixed - все имена, начинающиеся с <имя>.
# Операции: Read, Write, Describe (Describe нужен всегда вместе с Read/Write).
#
# Группы консьюмеров: сервис может использовать group.id,
# начинающийся со своего имени, например tf-model или tf-model-forecast.
#
# Удаление строки НЕ отзывает право - см. README, раздел «Права».
# ============================================================

# tf-funnel: пишет в tf.ingest.* и tf.dlq
tf-funnel   topic  prefixed  tf.ingest.           Write,Describe
tf-funnel   topic  literal   tf.dlq               Write,Describe

# tf-model: читает tf.ingest.*, пишет в tf.forecast.results и tf.dlq
tf-model    topic  prefixed  tf.ingest.           Read,Describe
tf-model    topic  literal   tf.forecast.results  Write,Describe
tf-model    topic  literal   tf.dlq               Write,Describe
tf-model    group  prefixed  tf-model             Read

# tf-bff: читает журнал, справочники и прогнозы, пишет в tf.dlq
tf-bff      topic  literal   tf.ingest.journal    Read,Describe
tf-bff      topic  literal   tf.ingest.reference  Read,Describe
tf-bff      topic  literal   tf.forecast.results  Read,Describe
tf-bff      topic  literal   tf.dlq               Write,Describe
tf-bff      group  prefixed  tf-bff               Read
