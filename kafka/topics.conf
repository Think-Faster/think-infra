# ============================================================
# Топики Kafka. Источник истины - таблица «Топики Kafka» (главная вкладка).
# Применяется контейнером tf-kafka-init при каждом `docker compose up`.
#
# Формат (одна строка - один топик, поля через пробелы):
#   <имя>  <партиции>  <config=value,config=value,...>
#
# - Новый топик создаётся с указанными партициями и настройками.
# - У существующего топика настройки из третьей колонки перезаписываются,
#   топик не пересоздаётся, данные не теряются.
# - Партиции можно только увеличить, и только вручную (см. README).
# - Replication factor всегда 1 (один брокер).
#
# Полезные значения:
#   retention.ms        7 дней = 604800000, 30 дней = 2592000000, бессрочно = -1
#   cleanup.policy      delete (по времени) | compact (последнее значение по ключу)
#   compression.type    lz4 | zstd
#   max.message.bytes   1048576 (1 МБ, больше нельзя по ТЗ)
# ============================================================

# ВНИМАНИЕ: партиции и хранение ниже - черновые значения,
# сверить с таблицей «Топики Kafka» перед первым запуском.

# Показания
tf.ingest.readings    6  retention.ms=604800000,compression.type=lz4,max.message.bytes=1048576

# Журнал диспетчера
tf.ingest.journal     3  retention.ms=2592000000,compression.type=lz4,max.message.bytes=1048576

# Справочники: compaction, последняя версия каждой сущности (по ключу) хранится бессрочно
tf.ingest.reference   3  cleanup.policy=compact,retention.ms=-1,compression.type=lz4,max.message.bytes=1048576

# Прогнозы
tf.forecast.results   3  retention.ms=604800000,compression.type=lz4,max.message.bytes=1048576

# Dead letter queue
tf.dlq                1  retention.ms=1209600000,compression.type=lz4,max.message.bytes=1048576
