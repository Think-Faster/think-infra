services:

  tf-redis:
    container_name: tf-redis

    image: redis:7-alpine

    # Пароль из Vault (secret/tf/redis), подставляет scripts/deploy.sh.
    # Клиенты подключаются с паролем: redis://:<TF_REDIS_PASSWORD>@tf-redis:6379
    environment:
      TF_REDIS_PASSWORD: ${TF_REDIS_PASSWORD:?TF_REDIS_PASSWORD is not set}

    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$TF_REDIS_PASSWORD"

    volumes:
      - redis-data:/data

    networks:
      - think-fast-net

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "REDISCLI_AUTH=\"$$TF_REDIS_PASSWORD\" redis-cli ping | grep -q PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: unless-stopped


volumes:

  redis-data:
    name: tf-redis-data


networks:
  think-fast-net:
    external: true